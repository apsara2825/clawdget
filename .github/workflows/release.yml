name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: build
        run: |
          mkdir -p release
          cc -std=gnu99 -O2 -Wall -Isrc -Ithirdparty \
             src/*.c thirdparty/cjson.c -o release/clawdget-linux-x86_64 -lcurl -lpthread
      - uses: actions/upload-artifact@v4
        with:
          name: clawdget-linux-x86_64
          path: release/clawdget-linux-x86_64

  mips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install musl cross toolchain
        run: |
          wget -q https://musl.cc/mipsel-linux-musl-cross.tgz
          tar xzf mipsel-linux-musl-cross.tgz
          echo "$PWD/mipsel-linux-musl-cross/bin" >> $GITHUB_PATH
      - name: build static
        run: |
          CROSS=mipsel-linux-musl- ./scripts/build-static.sh release
          mv release/clawdget release/clawdget-linux-mipsel
      - uses: actions/upload-artifact@v4
        with:
          name: clawdget-linux-mipsel
          path: release/clawdget-linux-mipsel

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [x86_64, mips]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/clawdget-*
          generate_release_notes: true
